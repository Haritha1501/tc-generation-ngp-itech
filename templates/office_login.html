<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Office Portal Login - TC Generator</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            background: #ffffff;
            overflow: hidden;
            width: 100%;
            max-width: 450px;
        }
        .login-header {
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            color: #ffffff;
            padding: 40px 30px;
            text-align: center;
        }
        .login-header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
        }
        .login-header p {
            font-size: 14px;
            margin-bottom: 0;
            opacity: 0.85;
        }
        .login-body {
            padding: 40px 30px;
        }
        .btn-emerald {
            background-color: #059669;
            color: white;
            border-color: #059669;
            font-weight: 600;
            padding: 12px;
            transition: all 0.3s ease;
        }
        .btn-emerald:hover {
            background-color: #047857;
            color: white;
            border-color: #047857;
            transform: translateY(-1px);
        }
        .form-control:focus {
            border-color: #059669;
            box-shadow: 0 0 0 0.2rem rgba(5, 150, 105, 0.25);
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-header">
        <i class="fa-solid fa-building-user fa-3x mb-3"></i>
        <h1>Office Portal</h1>
        <p>Central Office TC Management System</p>
    </div>
    
    <div class="login-body">
        {% if error %}
        <div class="alert alert-danger d-flex align-items-center mb-4" role="alert">
            <i class="fa-solid fa-triangle-exclamation me-2"></i>
            <div>{{ error }}</div>
        </div>
        {% endif %}
        
        <form action="/office/login" method="post" id="officeLoginForm">
            <div class="mb-3">
                <label for="username" class="form-label text-secondary fw-semibold">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-white"><i class="fa-solid fa-user text-secondary"></i></span>
                    <input type="text" class="form-control" id="username" name="username" placeholder="Enter Office username" required>
                </div>
            </div>
            
            <div class="mb-4">
                <label for="password" class="form-label text-secondary fw-semibold">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-white"><i class="fa-solid fa-lock text-secondary"></i></span>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                </div>
            </div>
            
            <div class="d-grid">
                <button type="submit" class="btn btn-emerald btn-lg">
                    <i class="fa-solid fa-right-to-bracket me-2"></i> Sign In to Office Portal
                </button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
